{% extends 'core/base.html' %}

{% block title %}Indes Portal — Nova chamada{% endblock %}

{% block content %}
<div class="page-back">
    <a href="{% url 'turma_detail' turma.id %}">← {{ turma.name }}</a>
</div>

<h1 class="page-title">Nova Lista de Presença</h1>
<p class="card-description mb-3">{{ turma.name }}{% if turma.course %} · {{ turma.course.name }}{% endif %}</p>

<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="date" class="form-label">Data da Aula</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ today }}"
                    class="form-input"
                    required
                >
            </div>

            <div class="presence-actions" style="margin-bottom: 0;">
                <button type="submit" class="btn btn-primary">Criar Lista</button>
                <a href="{% url 'turma_detail' turma.id %}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
